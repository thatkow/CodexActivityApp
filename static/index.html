<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Activity App</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --line: #dbe3ef;
        --text: #1f2a37;
        --muted: #5d6b82;
        --primary: #1f4fd7;
        --primary-hover: #173dad;
        --danger: #b42318;
        --danger-hover: #8f1b13;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #eef3fb 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 48px auto;
        padding: 0 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(16, 24, 40, 0.08);
        overflow: hidden;
      }

      .header {
        padding: 22px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header h1 {
        margin: 0;
        font-size: 22px;
      }

      .header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .add-btn {
        background: var(--primary);
        color: #fff;
      }

      .add-btn:hover { background: var(--primary-hover); }

      .delete-btn {
        background: var(--danger);
        color: #fff;
      }

      .delete-btn:hover { background: var(--danger-hover); }
      .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .table-wrap { padding: 12px 24px 24px; }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #f8faff; }
      tbody tr.selected { background: #e8efff; }

      .empty {
        padding: 28px 12px;
        text-align: center;
        color: var(--muted);
      }

      dialog {
        border: 0;
        border-radius: 12px;
        width: min(520px, 95vw);
        padding: 0;
        box-shadow: 0 20px 50px rgba(16, 24, 40, 0.3);
      }

      dialog::backdrop { background: rgba(0, 0, 0, 0.45); }

      .dialog-header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .dialog-header h2 { margin: 0; font-size: 20px; }

      form {
        padding: 16px 20px 20px;
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        margin-top: 5px;
      }

      textarea { min-height: 100px; resize: vertical; }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 8px;
      }

      .secondary {
        background: #edf1f7;
        color: var(--text);
      }

      .status {
        margin: 10px 24px 0;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div>
            <h1>Project Portfolio</h1>
            <p>Codex built this!</p>
          </div>
          <div class="actions">
            <button class="add-btn" id="openDialogBtn">Add Project</button>
            <button class="delete-btn" id="deleteBtn" disabled>Delete Selected</button>
          </div>
        </div>

        <p class="status" id="status"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Date Created</th>
              </tr>
            </thead>
            <tbody id="projectBody"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>No projects yet. Add one to get started.</div>
        </div>
      </div>
    </div>

    <dialog id="projectDialog">
      <div class="dialog-header">
        <h2>Create Project</h2>
      </div>
      <form id="projectForm">
        <label>
          Name
          <input id="name" type="text" required maxlength="255" />
        </label>

        <label>
          Description
          <textarea id="description" required maxlength="1000"></textarea>
        </label>

        <label>
          Date Created
          <input id="dateCreated" type="date" required />
        </label>

        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="add-btn">Save Project</button>
        </div>
      </form>
    </dialog>

    <script>
      const projectBody = document.getElementById("projectBody");
      const emptyState = document.getElementById("emptyState");
      const status = document.getElementById("status");
      const dialog = document.getElementById("projectDialog");
      const form = document.getElementById("projectForm");
      const openDialogBtn = document.getElementById("openDialogBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const deleteBtn = document.getElementById("deleteBtn");
      const dateInput = document.getElementById("dateCreated");

      let selectedProjectId = null;

      function setStatus(message) {
        status.textContent = message;
      }

      function todayDateString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function renderRows(projects) {
        projectBody.innerHTML = "";
        if (!projects.length) {
          emptyState.hidden = false;
          selectedProjectId = null;
          deleteBtn.disabled = true;
          return;
        }

        emptyState.hidden = true;
        for (const project of projects) {
          const tr = document.createElement("tr");
          if (project.id === selectedProjectId) {
            tr.classList.add("selected");
          }
          tr.innerHTML = `
            <td>${project.name}</td>
            <td>${project.description}</td>
            <td>${project.date_created}</td>
          `;
          tr.addEventListener("click", () => {
            selectedProjectId = project.id;
            deleteBtn.disabled = false;
            renderRows(projects);
          });
          projectBody.appendChild(tr);
        }
      }

      async function loadProjects() {
        const res = await fetch("/api/projects");
        if (!res.ok) {
          setStatus("Unable to load projects. Check database configuration.");
          return;
        }
        const projects = await res.json();
        if (!projects.some((p) => p.id === selectedProjectId)) {
          selectedProjectId = null;
          deleteBtn.disabled = true;
        }
        renderRows(projects);
      }

      openDialogBtn.addEventListener("click", () => {
        form.reset();
        dateInput.value = todayDateString();
        dialog.showModal();
      });

      cancelBtn.addEventListener("click", () => dialog.close());

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          name: document.getElementById("name").value.trim(),
          description: document.getElementById("description").value.trim(),
          date_created: dateInput.value || todayDateString(),
        };

        const res = await fetch("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          setStatus("Failed to create project.");
          return;
        }

        dialog.close();
        setStatus("Project created.");
        await loadProjects();
      });

      deleteBtn.addEventListener("click", async () => {
        if (!selectedProjectId) {
          return;
        }

        const confirmed = window.confirm("Delete selected project?");
        if (!confirmed) {
          return;
        }

        const res = await fetch(`/api/projects/${selectedProjectId}`, {
          method: "DELETE",
        });

        if (!res.ok) {
          setStatus("Failed to delete project.");
          return;
        }

        setStatus("Project deleted.");
        selectedProjectId = null;
        deleteBtn.disabled = true;
        await loadProjects();
      });

      dateInput.value = todayDateString();
      loadProjects();
    </script>
  </body>
</html>
