<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Business Portal | Create Account</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="auth-layout">
    <section class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Choose an existing organisation or add a new one.</p>
      {% if error %}<p class="message">{{ error }}</p>{% endif %}
      <form method="post" action="/register" class="form-grid">
        <label for="organization_id">Organisation (existing)</label>
        <select id="organization_id" name="organization_id">
          <option value="" selected>-- Optional if creating new --</option>
          {% for org in organisations %}
            <option value="{{ org.id }}">{{ org.name }}</option>
          {% endfor %}
        </select>

        <label for="new_organization">Create new organisation</label>
        <input id="new_organization" name="new_organization" type="text" placeholder="New Organisation Ltd" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@company.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required />

        <button type="submit" class="btn-primary">Create account</button>
      </form>
      <p class="footnote"><a href="/">Back to login</a></p>
    </section>
  </main>
</body>
</html>
